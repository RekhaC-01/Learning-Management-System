<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard - LMS Platform</title>
    <link rel="stylesheet" href="student-style.css">
    <style>
        .sidebar-menu li {
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: #94a3b8;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .sidebar-menu li:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .sidebar-menu li.active {
            background: #2563eb;
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>
<body style="display: flex; height: 100vh; margin: 0; background: #f8fafc; font-family: sans-serif;">
    <!-- Sidebar -->
    <div style="width: 260px; background: #1e293b; color: white; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;">
        <div>
            <h2>LMS Portal</h2>
            <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 30px;">INSTRUCTOR WORKSPACE</p>
            <ul class="sidebar-menu" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; margin: 0;">
                <li data-view="courses" class="active">Manage Courses</li>
                <li data-view="analytics">Student Analytics</li>
                <li data-view="profile">Profile</li>
            </ul>
        </div>
        <button id="logoutBtn" style="background: #ef4444; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600;">Logout</button>
    </div>

    <!-- Main Content Area -->
    <div style="flex: 1; display: flex; flex-direction: column; overflow-y: auto;">
        <header style="background: white; padding: 20px 40px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
            <h2 id="welcomeTitle" style="margin: 0; color: #1e293b;">Welcome back, Instructor</h2>
            <span style="background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;">INSTRUCTOR</span>
        </header>
        <main id="mainContentArea" style="padding: 40px; flex: 1;">
            <!-- Dynamic content loaded via JS -->
        </main>
    </div>

    <script src="js/instructor-dashboard.js"></script>
</body>
</html>
