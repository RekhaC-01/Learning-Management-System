<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .field-error {
            color: red;
            font-size: 0.85rem;
            margin-top: 4px;
            display: block;
        }
        .auth-container button {
            width: 100%;
            padding: 10px;
            background-color: #0066ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-container button:hover {
            background-color: #0052cc;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Login to Your Account</h2>
        <div id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" required>
                <span id="email-error" class="field-error"></span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
                <span id="password-error" class="field-error"></span>
            </div>
            <button type="button" id="loginBtn">Login</button>
        </div>
        <p id="errorMessage" style="color: red; margin-top: 10px;"></p>
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <script>
        const BASE_URL = "http://127.0.0.1:8080";

        async function apiRequest(endpoint, options = {}) {
            const url = endpoint.startsWith("http") ? endpoint : `${BASE_URL}${endpoint}`;
            const response = await fetch(url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                },
                credentials: "include"
            });
            
            if (!response.ok) {
                const responseText = await response.text();
                let errorMsg = "";
                
                try {
                    const errorData = JSON.parse(responseText);
                    errorMsg = errorData.message || errorData.error;
                } catch (e) {
                    errorMsg = responseText;
                }
                
                throw new Error(errorMsg || `HTTP error! Status: ${response.status}`);
            }

            const contentType = response.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                return await response.json();
            }
            return null;
        }

        document.getElementById("loginBtn").addEventListener("click", async () => {
            const errorMessage = document.getElementById("errorMessage");
            const emailError = document.getElementById("email-error");
            
            if (errorMessage) errorMessage.textContent = "";
            if (emailError) emailError.textContent = "";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email || !password) {
                if (errorMessage) errorMessage.textContent = "Please fill in all fields.";
                return;
            }

            try {
                await apiRequest("/api/auth/login", {
                    method: "POST",
                    body: JSON.stringify({ email, password })
                });

                const user = await apiRequest("/api/auth/me", {
                    method: "GET"
                });

                if (user.role === "ADMIN") {
                    window.location.href = "admin-dashboard.html";
                } else if (user.role === "INSTRUCTOR") {
                    window.location.href = "instructor-dashboard.html";
                } else {
                    window.location.href = "student-dashboard.html";
                }

            } catch (error) {
                if (emailError) {
                    emailError.textContent = error.message;
                } else if (errorMessage) {
                    errorMessage.textContent = error.message;
                }
            }
        });
    </script>
</body>
</html>
