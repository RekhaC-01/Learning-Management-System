<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LMS Platform</title>
    <link rel="stylesheet" href="./student-style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>LMS Portal</h2>
                <span class="role-subtitle">Admin Workspace</span>
            </div>
            <ul class="sidebar-menu">
                <li data-view="overview" class="active">📊 Overview</li>
                <li data-view="categories">🏷️ Manage Categories</li>
                <li data-view="users">👥 Manage Users</li>
                <li data-view="courses">📚 Oversee Courses</li>
            </ul>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </aside>

        <!-- Main Workspace Area -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="adminWelcomeTitle">Loading Admin Panel...</h1>
                <div class="top-bar-right">
                    <span class="badge" style="background-color: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 4px; font-weight: 600;">ADMIN</span>
                </div>
            </header>
            <section class="content-body">
                <div id="adminMainContentArea"></div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
